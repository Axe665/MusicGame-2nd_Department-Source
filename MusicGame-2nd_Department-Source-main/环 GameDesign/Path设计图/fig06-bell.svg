<filter id="fig06-bell-bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect width="1200" height="820" fill="url(#fig06-bell-vig)"/><text x="48.0" y="46.0" fill="#9A948C" font-family="DejaVu Sans Mono" font-size="12" font-weight="500" text-anchor="start" letter-spacing="3">TAMAKI³ / NOTE TYPES</text><text x="1152.0" y="46.0" fill="#5F5A55" font-family="DejaVu Sans Mono" font-size="12" font-weight="500" text-anchor="end">FIG06</text><text x="48.0" y="94.0" fill="#F4EFE9" font-family="Noto Serif CJK SC" font-size="30" font-weight="600" text-anchor="start">Bell：环上的金币</text><text x="48.0" y="124.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" text-anchor="start">圆形范围＋目标拍点；经过即收，不占按键，也不进普通连击。</text><circle cx="430" cy="430" r="190" fill="none" stroke="#333845" stroke-width="2"/><circle cx="576" cy="308" r="70" fill="#FFD36B" opacity="0.06"/><circle cx="576" cy="308" r="70" fill="none" stroke="#FFD36B" stroke-width="1.4" stroke-dasharray="5 7" opacity="0.8"/><circle cx="576" cy="308" r="24" fill="#FFD36B" opacity="0.18" filter="url(#fig06-bell-bl)"/><circle cx="576" cy="308" r="17" fill="#FFD36B"/><circle cx="576" cy="308" r="9" fill="none" stroke="#3A2C07" stroke-width="2" opacity="0.8"/><text x="575.5" y="215.9" fill="#FFD36B" font-family="Noto Sans CJK SC" font-size="11" font-weight="500" text-anchor="middle">收取半径</text><text x="430.0" y="670.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="middle">进入这个圆就收下，不需要按键</text><text x="760.0" y="380.0" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="16" font-weight="600" text-anchor="start">时间</text><line x1="760" y1="420" x2="1090" y2="420" stroke="#333845" stroke-width="2"/><rect x="880" y="404" width="130" height="32" fill="#FFD36B" opacity="0.16"/><line x1="945" y1="392" x2="945" y2="448" stroke="#FFD36B" stroke-width="2"/><text x="945.0" y="382.0" fill="#FFD36B" font-family="Noto Sans CJK SC" font-size="11" font-weight="500" text-anchor="middle">目标拍点</text><text x="880.0" y="470.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="10" font-weight="400" text-anchor="start">−100ms</text><text x="1010.0" y="470.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="10" font-weight="400" text-anchor="start">+100ms</text><text x="760.0" y="520.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="start">窗口内经过算收集；窗口外擦到不补记。</text><text x="760.0" y="546.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="start">收集率单独结算，不进普通连击、不扣准确率。</text></svg>
