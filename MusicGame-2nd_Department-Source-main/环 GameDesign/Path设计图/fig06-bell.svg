<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="b6t b6d" id="fig06-bell-root"><title id="b6t">Bell：环上的金币</title><desc id="b6d">金币是圆形范围，光标进入即收集，不需要按键；目标拍点前后各有 100 毫秒窗口。</desc><defs>
      <style>#fig06-bell-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#fig06-bell-root .diagram-container { overflow:visible }
}</style>
