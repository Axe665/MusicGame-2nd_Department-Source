<text x="48.0" y="96.0" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="31" font-weight="600" text-anchor="start">环上准度：顶部弧＋误差刻度</text>
<text x="48.0" y="126.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="15.5" font-weight="400" text-anchor="start">弧负责远看，命中角负责近看；误差点不占弧面，挂在弧的下沿。</text>

.4" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="345.6" y1="397.5" x2="354.7" y2="419.3" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="378.0" y1="384.8" x2="368.9" y2="359.6" stroke="#5FD3D0" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="411.1" y1="373.9" x2="414.2" y2="384.2" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="444.7" y1="364.7" x2="449.5" y2="384.5" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="478.8" y1="357.3" x2="481.3" y2="371.1" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="513.1" y1="351.8" x2="510.9" y2="334.7" stroke="#5FD3D0" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="547.8" y1="348.1" x2="549.9" y2="374.8" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="582.6" y1="346.2" x2="583.0" y2="361.8" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="617.4" y1="346.2" x2="617.7" y2="335.4" stroke="#5FD3D0" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="652.2" y1="348.1" x2="650.5" y2="370.0" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="686.9" y1="351.8" x2="684.4" y2="370.4" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="721.2" y1="357.3" x2="725.0" y2="337.3" stroke="#5FD3D0" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="755.3" y1="364.7" x2="753.1" y2="373.6" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="788.9" y1="373.9" x2="782.1" y2="396.5" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="822.0" y1="384.8" x2="812.3" y2="411.5" stroke="#FF6242" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/><line x1="854.4" y1="397.5" x2="859.9" y2="384.6" stroke="#5FD3D0" stroke-width="4.2" opacity="1" stroke-linecap="round"/><line x1="886.2" y1="411.9" x2="880.7" y2="423.1" stroke="#FF6242" stroke-width="4.2" opacity="1" stroke-linecap="round"/><line x1="917.1" y1="428.0" x2="908.7" y2="443.0" stroke="#FF6242" stroke-width="4.2" opacity="1" stroke-linecap="round"/><text x="600.0" y="442.0" fill="#9FE7E4" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" text-anchor="middle">最近 20 次命中：向外偏早、向内偏晚，越靠右越新</text><text x="600.0" y="466.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="middle">长度＝偏差大小；它只描述反馈，不改变判定</text><line x1="225.7" y1="324.8" x2="191.7" y2="268.8" stroke="#9A948C" stroke-width="1"/><text x="185.7" y="262.8" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="end">曲目进度</text><text x="185.7" y="282.8" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="end">与准度无关</text><line x1="974.3" y1="324.8" x2="1004.3" y2="262.8" stroke="#9A948C" stroke-width="1"/><text x="1010.3" y="256.8" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="start">准度</text><text x="1010.3" y="276.8" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="start">四位小数，逐帧更新</text><text x="600.0" y="202.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" text-anchor="middle">AAA 由准度分段</text><line x1="48" y1="540" x2="672" y2="540" stroke="#242832" stroke-width="1"/><text x="48.0" y="572.0" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="start">命中角：近看的那一层</text><circle cx="320" cy="690" r="92" fill="none" stroke="#3A3F4C" stroke-width="1.6"/><path d="M 339.1 600.0 A 92 92 0 0 1 376.6 617.5" fill="none" stroke="#FF6242" stroke-width="10" stroke-linecap="round" opacity="1"/><path d="M 339.1 600.0 A 92 92 0 0 1 376.6 617.5" fill="none" stroke="#FF6242" stroke-width="26" stroke-linecap="round" opacity="0.16"/><text x="392.9" y="598.6" fill="#FFC4B2" font-family="DejaVu Sans Mono" font-size="15" font-weight="600" text-anchor="start" letter-spacing="1">GREAT</text><text x="392.9" y="620.6" fill="#9FE7E4" font-family="DejaVu Sans Mono" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1">FRAY</text><line x1="362.9" y1="582.6" x2="378.9" y2="582.6" stroke="#FFC4B2" stroke-width="1"/><text x="170.0" y="822.0" fill="#5F5A55" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" text-anchor="start">扇区闪弧＋两行判定字：上行时间档，下行 Path 三档。</text><text x="700.0" y="600.0" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="14" font-weight="600" text-anchor="start">弧只管远看：进度、评级、准度三段。</text><text x="700.0" y="628.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start">近看交给命中角：闪弧长度与颜色表示档位，</text><text x="700.0" y="650.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start">两行小字区分“时间准不准”与“跟没跟上”。</text><text x="700.0" y="684.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start">弧与刻度都钉在输入盘的顶弧上，</text><text x="700.0" y="706.0" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" text-anchor="start">判定边界折叠、收缩都不带动它们。</text>
